<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Perks</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
      <div class="loading-text">⏳ Cargando imagenes...</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
      <div class="loading-percent" id="loadingPercent">0%</div>
    </div>
  </div>

  <div id="perkTooltip"></div>

  <!-- Modal de confirmación de eliminación -->
  <div class="modal-overlay" id="removeModalOverlay">
    <div class="modal-content">
      <h3 id="removeModalText">¿Seguro que quieres quitar esta opción de la ruleta?</h3>
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="removeModalCancelBtn">Cancelar</button>
        <button class="modal-btn confirm" id="removeModalConfirmBtn" style="background:#d93838;">Quitar</button>
      </div>
    </div>
  </div>

  <!-- Primera pantalla -->
  <div id="stageOuter">
   <div id="stageScaler">
    <div class="stage">
      
      <div class="wheel-section">
        <h1></h1>
        <div class="wheel-wrap">
          <div class="pointer" id="pointer"></div>
          <canvas id="wheel"></canvas>

          <!-- CAPA INDEPENDIENTE DEL ANILLO NEÓN -->
          <div class="ruleta-container" id="ruletaNeon">
            <svg viewBox="0 0 220 220">
              <defs>
                <filter id="blur-soft" x="-100%" y="-100%" width="300%" height="300%">
                  <feGaussianBlur stdDeviation="1.2" />
                </filter>
                <filter id="blur-wide" x="-100%" y="-100%" width="300%" height="300%">
                  <feGaussianBlur stdDeviation="3.2" />
                </filter>
              </defs>

              <g class="glow-spin ring-layer" data-width="7.5" filter="url(#blur-wide)" opacity="0.65"></g>
              <g class="glow-spin ring-layer" data-width="5.8" filter="url(#blur-soft)" opacity="0.85"></g>
              <g class="glow-spin ring-layer" data-width="5.2" opacity="1"></g>
              <g class="glow-spin">
                <circle id="neonCore" r="112" cx="110" cy="110" stroke="#ffffff" stroke-width="6" fill="none"/>
              </g>
            </svg>
          </div>

          <div class="center-diamond-wrapper">
            <div class="center-diamond">
              <img id="diamondImg" class="center-diamond-img" src="" alt="Perk">
            </div>
          </div>

          <!-- Imagen misterio -->
          <img id="mysteryDiamondImg" class="mystery-diamond-img" src="source/misterio.webp" alt="Misterio">

          <!-- Fondo oscuro del modo espera -->
          <div class="wheel-dark-overlay" id="wheelDarkOverlay"></div>

          <!-- Imagen de Click to Spin -->
          <div class="spin-hint" aria-hidden="true">
            <img src="source/clicktospin.png" alt="Girar ruleta" class="spin-hint-img">
          </div>

          <!-- Pantalla ganadora dentro de la ruleta -->
          <div class="winner-overlay" id="winnerOverlay">
            <div class="winner-banner">
              <div class="winner-img-wrap">
                <img id="winnerImg" src="" alt="Ganador">
              </div>
              <div class="winner-text" id="winnerText"></div>
            </div>
          </div>
          
          <video id="ruletaFxVideo" class="wheel-fx-video" src="source/ruleta.webm" muted playsinline></video>

        </div>
      </div>

      <!-- Panel de donaciones -->
      <div class="donations-container">
        <div class="header-status">
          <h3>PERKS AÑADIDAS</h3>
          <div class="status-badge" id="statusBadge" title="Verificando conexión...">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
          </div>
        </div>

        <div class="donations-scroll" id="donationsScroll">
          <ul id="donationsList">
            <li class="empty">SIN PERKS AÑADIDAS...</li>
          </ul>
        </div>
      </div>

    </div>
   </div>
  </div>

  <!-- Segunda pantalla -->
  <div class="admin-section">
    <div class="container">
      <div class="panel">
        <div class="panel-header">
          <h2>Opciones Predeterminados</h2>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Buscar opción...">
        </div>
        <div class="db-grid" id="dbList"></div>

        <div class="pagination-controls">
          <button class="page-btn" id="prevPageBtn">⬅️ Anterior</button>
          <span class="page-info" id="pageInfo">Página 1 de 1</span>
          <button class="page-btn" id="nextPageBtn">Siguiente ➡️</button>
        </div>
      </div>
    </div>
  </div>

 <div id="admin-panel" class="admin-panel">
  <button id="btn-toggle-panel" class="admin-toggle-btn" type="button">
    ⚙️ Panel de Administración
    <span class="arrow">▼</span>
  </button>

  <div id="admin-submenu" class="admin-submenu">
    <div class="submenu-item">
      <label>Contraseña maestra</label>
      <input type="password" id="admin-pass" placeholder="Contraseña maestra" />
    </div>
    <div class="submenu-item">
      <label>Nueva Key de Streamlabs</label>
      <input type="text" id="new-streamlabs-key" placeholder="Nueva Key de Streamlabs" />
    </div>
    <button id="btn-save-key" type="button">Actualizar Key</button>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <script type="module" src="/ruleta/scripts/main.js"></script>

  <script>
    const toggleBtn = document.getElementById('btn-toggle-panel');
    const submenu = document.getElementById('admin-submenu');

    if (toggleBtn && submenu) {
      toggleBtn.addEventListener('click', function () {
        submenu.classList.toggle('open');
        toggleBtn.classList.toggle('active');
      });
    }
  </script>

</body>
</html>
